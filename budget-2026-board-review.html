<style>
:root{--navy:#142850;--orange:#DC6428;--border:#e2e6f0;--font:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);background:linear-gradient(135deg,var(--navy) 0%,#1e3a6e 60%,#1a3668 100%);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.gate{width:100%;max-width:380px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:34px 30px;backdrop-filter:blur(6px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.logo{width:38px;height:38px;border-radius:9px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:17px}
.bname{font-size:16px;font-weight:700}
.bsub{font-size:11px;color:rgba(255,255,255,.5)}
h1{font-size:17px;font-weight:700;letter-spacing:-.2px}
.sub{font-size:12.5px;color:rgba(255,255,255,.55);margin:6px 0 20px;line-height:1.5}
label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.5);font-weight:700}
input{width:100%;margin-top:8px;padding:12px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.22);color:#fff;font-family:var(--mono);font-size:14px;letter-spacing:.04em;outline:none}
input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(220,100,40,.18)}
button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:9px;background:var(--orange);color:#fff;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;transition:filter .15s}
button:hover{filter:brightness(1.06)}
button:disabled{opacity:.55;cursor:default}
.err{margin-top:14px;font-size:12px;color:#fca5a5;min-height:16px;font-family:var(--mono)}
.foot{margin-top:22px;font-size:10.5px;color:rgba(255,255,255,.35);line-height:1.5}
</style>

var f=document.getElementById('f'),inp=document.getElementById('p'),btn=document.getElementById('btn'),err=document.getElementById('err');
